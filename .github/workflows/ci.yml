name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --experimental-strip-types scripts/cron-up.ts --help
      - run: node --experimental-strip-types scripts/cron-down.ts --help
      - run: node --experimental-strip-types scripts/cron-link.ts --help
